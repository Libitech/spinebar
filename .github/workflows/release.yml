# v1.2.3 形式のタグを push すると、拡張機能のzipを作成して GitHub Releases に添付する
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches manifest.json
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "manifest.json の version ($MANIFEST_VERSION) とタグ ($TAG_VERSION) が一致しません"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist
          # manifest.json がzipの最上位に来る形（Chrome Web Store の申請にもそのまま使える）
          zip -r "dist/spinebar.zip" \
            manifest.json background.js autoopen.js \
            sidepanel.html sidepanel.css sidepanel.js \
            icons
          unzip -l dist/spinebar.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/spinebar.zip" \
            --title "Spinebar $GITHUB_REF_NAME" \
            --generate-notes
